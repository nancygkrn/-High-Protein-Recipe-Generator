<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>High Protein Recipe Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Get high protein recipes</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="recipe-generator-form">
            <input
              type="text"
              placeholder="Enter the ingerients you want to add"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e Chicken, Eggs, Chocolate</div>
        </div>
        <div class="recipe" id="recipe"></div>
      </main>
    </div>
  </body>

  <footer>
    This AI project was coded by
    <a href="https://github.com/nancygkrn">Nancy G</a>, it is
    <a href="https://github.com/nancygkrn/-High-Protein-Recipe-Generator"
      >open sourced</a
    >
    and is hosted in
    <a
      href="https://ai-high-protein-recipe-generator.netlify.app/"
      target="_blank"
      rel="noopener noreferrer"
      >Netlify</a
    >
  </footer>

  <script src="src/index.js"></script>
</html>
